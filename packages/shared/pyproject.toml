[project]
name = "shared"
version = "0.1.0"
description = "Shared models and broker interface for the paper-trading engines"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "redis>=5.0",
    "supabase>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shared*"]
