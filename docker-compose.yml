services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  data-engine:
    build:
      context: .
      dockerfile: services/data-engine/Dockerfile
    env_file: .env
    depends_on:
      - redis

  strategy-engine:
    build:
      context: .
      dockerfile: services/strategy-engine/Dockerfile
    env_file: .env
    volumes:
      - ./data_cache:/app/data_cache:ro
      - ./instruments_nse.json:/app/instruments_nse.json:ro
    depends_on:
      - redis
      - data-engine

  risk-engine:
    build:
      context: .
      dockerfile: services/risk-engine/Dockerfile
    env_file: .env
    depends_on:
      - redis
      - strategy-engine

  execution-engine:
    build:
      context: .
      dockerfile: services/execution-engine/Dockerfile
    env_file: .env
    depends_on:
      - redis
      - risk-engine

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - redis
